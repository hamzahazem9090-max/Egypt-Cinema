<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070a">
<meta name="referrer" content="no-referrer">
<title>Egypt Cinema — مشاهدة الأفلام اون لاين</title>
<meta name="description" content="Egypt Cinema — موقع مشاهدة الأفلام المترجمة اون لاين بجودة عالية">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="style.css?v=20260915j">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="#/" class="logo">🎬 Egypt <span>Cinema</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">الرئيسية</a>
      <a href="#/movies" data-nav="browse">جميع الأفلام</a>
      <a href="#/library/favorites" data-nav="favs">المفضلة<span class="count"></span></a>
      <a href="#/library/history" data-nav="hist">آخر المشاهدة<span class="count"></span></a>
      <a href="#/library/rated" data-nav="rated">قيمت عليها<span class="count"></span></a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <input type="search" id="searchInput" placeholder="ابحث عن أي فيلم أو مسلسل..." aria-label="ابحث عن فيلم" autocomplete="off" spellcheck="false">
      <button type="button" class="search-clear" id="searchClear" aria-label="مسح البحث" hidden>✕</button>
      <button type="submit" class="search-go" aria-label="بحث">🔍</button>
    </form>
    <div class="search-drop" id="searchDrop" hidden></div>
  </div>
</header>

<main class="container main" id="app"></main>

<div class="loading" id="loadingTop">
  <div class="spinner"></div>
  <p>جاري التحميل...</p>
</div>

<footer class="footer">
  <div class="container">
    <p>🎬 Egypt <span style="color:var(--accent)">Cinema</span> — مشاهدة الأفلام اون لاين</p>
    <p class="footer-note">جميع الأفلام تعرض عبر المصدر المتاح للبث، ونجتهد لتوفير أفضل تجربة مشاهد.</p>
  </div>
</footer>

<div class="toast" id="toast" hidden></div>

<button class="back-top" id="backTop" title="العودة للأعلى" aria-label="العودة للأعلى">↑</button>

<script src="app.js?v=20260915i"></script>
</body>
</html>
