<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egypt Cinema — مشاهدة الأفلام اون لاين</title>
<meta name="description" content="Egypt Cinema — موقع مشاهدة الأفلام المترجمة اون لاين بجودة عالية">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="#/" class="logo">🎬 Egypt Cinema</a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">الرئيسية</a>
      <a href="#/movies" data-nav="browse">جميع الأفلام</a>
      <a href="#/library/favorites" data-nav="favs">المفضلة<span class="count"></span></a>
      <a href="#/library/history" data-nav="hist">آخر المشاهدة<span class="count"></span></a>
      <a href="#/library/rated" data-nav="rated">قيمت عليها<span class="count"></span></a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <input type="search" id="searchInput" placeholder="ابحث عن فيلم مترجم..." aria-label="ابحث عن فيلم">
      <button type="submit" aria-label="بحث">🔍</button>
    </form>
  </div>
</header>

<main class="container main" id="app">
  <div class="loading" id="loadingTop">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p>🎬 <strong>Egypt Cinema</strong> — موقع مشاهدة الأفلام المترجمة اون لاين</p>
    <p class="footer-note">جميع الأفلام تعرض عبر المصدر المتاح للبث، ونجتهد لتوفير أفضل تجربة مشاهد.</p>
  </div>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
